services:
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - UID=${PUID}
      - GID=${PGID}
    volumes:
      - /data/media/downloads:/downloads
      - /data/media/music:/downloads/audio
